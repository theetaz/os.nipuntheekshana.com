name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1' # Mondays 03:17 UTC: rebuild to refresh GitHub activity data

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  build:
    name: Check, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Cache optimised images
        uses: actions/cache@v6
        with:
          path: node_modules/.astro
          key: astro-assets-${{ hashFiles('src/assets/**') }}
          restore-keys: astro-assets-
      - name: Type-check
        run: npm run check
      - name: Build
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          PUBLIC_BUILD_SHA: ${{ github.sha }}
      - name: Unit tests
        run: npm test
      - name: Budgets
        run: npm run budgets
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: |
            dist
            .wrangler/deploy
          include-hidden-files: true
          retention-days: 7

  e2e:
    name: End-to-end
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: .
      - name: Configure local postcard verification
        run: |
          cat > .dev.vars <<'EOF'
          TURNSTILE_SECRET="1x0000000000000000000000000000000AA"
          TURNSTILE_SITE_KEY="1x00000000000000000000AA"
          IP_HASH_SALT="local-postcards-test-salt"
          ADMIN_TOKEN="local-postcards-test-admin-token"
          EOF
          node node_modules/wrangler/bin/wrangler.js d1 migrations apply serendib --local
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  lighthouse:
    name: Lighthouse
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: .
      - run: npm run lhci:desktop
      - run: npm run lhci:mobile

  deploy:
    name: Deploy to Cloudflare
    needs: [build, e2e, lighthouse]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://os.nipuntheekshana.com
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: .
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply D1 migrations
        run: node node_modules/wrangler/bin/wrangler.js d1 migrations apply serendib --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          wranglerVersion: '4.149.0'
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --message "${{ github.sha }}"
